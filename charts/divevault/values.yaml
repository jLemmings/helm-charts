replicaCount: 1

image:
  repository: ghcr.io/jlemmings/divevault
  tag: v0.3.3
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

app:
  corsOrigin: "*"
  logLevel: INFO
  demoMode: false
  metrics:
    enabled: disabled

  limits:
    maxJsonBodyBytes: 1048576
    maxBackupImportBytes: 26214400
    maxListLimit: 200

  rateLimit:
    windowSeconds: 60
    cliRequestPerWindow: 30
    cliApprovePerWindow: 15
    backupImportPerWindow: 10
    diveUploadPerWindow: 120

resources: {}

database:
  existingSecret: ""
  secretName: ""
  secretKey: database-url
  url: postgresql://dive:dive@postgres:5432/dive
  startupMigrations: enabled
  startupRetries: 5
  startupRetryDelaySeconds: 2
  connectTimeoutSeconds: 5

# Secret keys should be named AUTH_JWT_SECRET when using auth.existingSecret.
auth:
  existingSecret: ""
  secretName: ""
  jwtSecret: ""
  jwtIssuer: divevault.local
  jwtAudience: divevault.app
  tokenTtlSeconds: 43200
  cliRequestTtl: 600
  cliTokenTtl: 1800

nominatim:
  baseUrl: https://nominatim.openstreetmap.org
  userAgent: DiveVault/1.0
  email: ""

serviceAccount:
  create: false
  name: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: divevault.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

traefikIngressRoute:
  enabled: false
  className: ""
  annotations: {}
  entryPoints:
    - websecure
  routes:
    - match: Host(`divevault.example.com`)
      kind: Rule
      middlewares: []
      services:
        - name: ""
          port: null
          scheme: ""
  tls: {}
