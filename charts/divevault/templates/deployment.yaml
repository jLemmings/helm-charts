apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "divevault.fullname" . }}
  labels:
    {{- include "divevault.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "divevault.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "divevault.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "divevault.serviceAccountName" . }}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or .Values.auth.existingSecret .Values.auth.clerkSecretKey .Values.auth.clerkJwtKey .Values.auth.viteClerkPublishableKey }}
          envFrom:
            - secretRef:
                name: {{ include "divevault.authSecretName" . }}
          {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "divevault.databaseSecretName" . }}
                  key: {{ .Values.database.secretKey }}
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: CORS_ORIGIN
              value: {{ .Values.env.corsOrigin | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
            - name: CLERK_API_URL
              value: {{ .Values.env.clerkApiUrl | quote }}
            - name: CLERK_FRONTEND_API_URL
              value: {{ .Values.env.clerkFrontendApiUrl | quote }}
            - name: CLERK_JWKS_URL
              value: {{ .Values.env.clerkJwksUrl | quote }}
            - name: CLERK_AUTHORIZED_PARTIES
              value: {{ .Values.env.clerkAuthorizedParties | quote }}
            - name: CLERK_API_KEY_SCOPES
              value: {{ .Values.env.clerkApiKeyScopes | quote }}
            - name: CLI_AUTH_REQUEST_TTL
              value: {{ .Values.env.cliAuthRequestTtl | quote }}
            - name: CLI_AUTH_TOKEN_TTL
              value: {{ .Values.env.cliAuthTokenTtl | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
