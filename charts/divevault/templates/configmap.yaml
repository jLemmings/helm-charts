apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "divevault.configMapName" . }}
  labels:
    {{- include "divevault.labels" . | nindent 4 }}
data:
  HOST: "0.0.0.0"
  PORT: {{ .Values.service.port | quote }}
  CORS_ORIGIN: {{ .Values.app.corsOrigin | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  DEMO_MODE: {{ .Values.app.demoMode | quote }}
  METRICS_ENABLED: {{ .Values.app.metrics.enabled | quote }}
  AUTH_JWT_ISSUER: {{ .Values.auth.jwtIssuer | quote }}
  AUTH_JWT_AUDIENCE: {{ .Values.auth.jwtAudience | quote }}
  AUTH_TOKEN_TTL_SECONDS: {{ .Values.auth.tokenTtlSeconds | quote }}
  CLI_AUTH_REQUEST_TTL: {{ .Values.auth.cliRequestTtl | quote }}
  CLI_AUTH_TOKEN_TTL: {{ .Values.auth.cliTokenTtl | quote }}
  STARTUP_MIGRATIONS: {{ .Values.database.startupMigrations | quote }}
  NOMINATIM_BASE_URL: {{ .Values.nominatim.baseUrl | quote }}
  NOMINATIM_USER_AGENT: {{ .Values.nominatim.userAgent | quote }}
  NOMINATIM_EMAIL: {{ .Values.nominatim.email | quote }}
  DB_STARTUP_RETRIES: {{ .Values.database.startupRetries | quote }}
  DB_STARTUP_RETRY_DELAY_SECONDS: {{ .Values.database.startupRetryDelaySeconds | quote }}
  DB_CONNECT_TIMEOUT_SECONDS: {{ .Values.database.connectTimeoutSeconds | quote }}
  MAX_JSON_BODY_BYTES: {{ .Values.app.limits.maxJsonBodyBytes | quote }}
  MAX_BACKUP_IMPORT_BYTES: {{ .Values.app.limits.maxBackupImportBytes | quote }}
  MAX_LIST_LIMIT: {{ .Values.app.limits.maxListLimit | quote }}
  RATE_LIMIT_WINDOW_SECONDS: {{ .Values.app.rateLimit.windowSeconds | quote }}
  RATE_LIMIT_CLI_REQUEST_PER_WINDOW: {{ .Values.app.rateLimit.cliRequestPerWindow | quote }}
  RATE_LIMIT_CLI_APPROVE_PER_WINDOW: {{ .Values.app.rateLimit.cliApprovePerWindow | quote }}
  RATE_LIMIT_BACKUP_IMPORT_PER_WINDOW: {{ .Values.app.rateLimit.backupImportPerWindow | quote }}
  RATE_LIMIT_DIVE_UPLOAD_PER_WINDOW: {{ .Values.app.rateLimit.diveUploadPerWindow | quote }}
