{{- if and (not .Values.auth.existingSecret) (or .Values.auth.clerkSecretKey .Values.auth.clerkJwtKey .Values.auth.viteClerkPublishableKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "divevault.authSecretName" . }}
  labels:
    {{- include "divevault.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.clerkSecretKey }}
  CLERK_SECRET_KEY: {{ .Values.auth.clerkSecretKey | quote }}
  {{- end }}
  {{- if .Values.auth.clerkJwtKey }}
  CLERK_JWT_KEY: {{ .Values.auth.clerkJwtKey | quote }}
  {{- end }}
  {{- if .Values.auth.viteClerkPublishableKey }}
  VITE_CLERK_PUBLISHABLE_KEY: {{ .Values.auth.viteClerkPublishableKey | quote }}
  {{- end }}
{{- end }}
