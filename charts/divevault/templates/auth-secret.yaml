{{- if and (not .Values.auth.existingSecret) .Values.auth.jwtSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "divevault.authSecretName" . }}
  labels:
    {{- include "divevault.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
{{- end }}
