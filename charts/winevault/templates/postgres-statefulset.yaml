{{- if eq (include "winevault.postgresEnabled" .) "true" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "winevault.fullname" . }}-postgres
  labels:
    {{- include "winevault.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "winevault.fullname" . }}-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "winevault.name" . }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "winevault.name" . }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-postgres" (include "winevault.fullname" .)) .Values.postgres.existingSecret.name | quote }}
                  key: {{ .Values.postgres.existingSecret.databaseKey | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-postgres" (include "winevault.fullname" .)) .Values.postgres.existingSecret.name | quote }}
                  key: {{ .Values.postgres.existingSecret.userKey | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-postgres" (include "winevault.fullname" .)) .Values.postgres.existingSecret.name | quote }}
                  key: {{ .Values.postgres.existingSecret.passwordKey | quote }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgres.storage.className | quote }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
