apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "winevault.fullname" . }}
  labels:
    {{- include "winevault.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "winevault.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/database-secret: {{ include (print $.Template.BasePath "/database-secret.yaml") . | sha256sum }}
      labels:
        {{- include "winevault.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if .Values.openai.existingSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openai.existingSecret | quote }}
                  key: {{ required "openai.secretKey must be set when openai.existingSecret is configured" .Values.openai.secretKey | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "winevault.databaseSecretName" . }}
                  key: {{ .Values.database.secretKey }}
            - name: HTTP_ADDR
              value: {{ .Values.app.env.httpAddr | quote }}
            - name: AUTH_COOKIE_SECURE
              value: {{ .Values.app.env.authCookieSecure | quote }}
            - name: PORT
              value: {{ .Values.service.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.app.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
