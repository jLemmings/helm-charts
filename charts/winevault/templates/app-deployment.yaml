apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "winevault.fullname" . }}
  labels:
    {{- include "winevault.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "winevault.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/database-secret: {{ include (print $.Template.BasePath "/database-secret.yaml") . | sha256sum }}
      labels:
        {{- include "winevault.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "winevault.databaseSecretName" . }}
                  key: {{ .Values.database.secretKey }}
            - name: HTTP_ADDR
              value: {{ .Values.app.env.httpAddr | quote }}
            - name: AUTH_COOKIE_SECURE
              value: {{ .Values.app.env.authCookieSecure | quote }}
            - name: PORT
              value: {{ .Values.service.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
