replicaCount: 1

image:
  repository: ghcr.io/jlemmings/winevault
  tag: latest
  pullPolicy: IfNotPresent

app:
  service:
    type: ClusterIP
    port: 3000
  env:
    authCookieSecure: "true"
    httpAddr: ":8080"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

database:
  existingSecret: ""
  secretName: ""
  secretKey: database-url
  url: postgres://winevault:winevault_dev@winevault-postgres:5432/winevault?sslmode=disable

postgres:
  enabled: true
  image: postgres:17-alpine
  user: winevault
  password: winevault_dev
  database: winevault
  port: 5432
  existingSecret:
    name: ""
    userKey: POSTGRES_USER
    passwordKey: POSTGRES_PASSWORD
    databaseKey: POSTGRES_DB
  storage:
    size: 8Gi
    className: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

traefikIngressRoute:
  enabled: false
  className: ""
  annotations: {}
  entryPoints:
    - websecure
  routes:
    - match: Host(`winevault.example.com`)
      kind: Rule
      middlewares: []
      services:
        - name: ""
          port: null
          scheme: ""
  tls: {}

serviceAccount:
  create: true
  name: ""
